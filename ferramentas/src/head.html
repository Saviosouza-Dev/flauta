<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graus e Campos na Flauta — Cartilha do Aluno</title>
<meta name="description" content="Cartilha do aluno de flauta transversal: nome das notas e cifras, escala maior e graus, formação de acordes, campo harmônico maior e campos menores (natural, harmônico e melódico), com exercícios em partitura, áudio e jogos.">
<meta name="theme-color" content="#4A3220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2E9D3;
    --paper-deep:#E9DCBC;
    --sheet:#FBF7EC;
    --ink:#3B2A1B;
    --ink-soft:#6B5340;
    --wood:#8C5A2E;
    --wood-deep:#4A3220;
    --wood-light:#C99A5B;
    --brass:#B8862E;
    --brass-deep:#9A6A1C;
    --string:#D8B24C;
    --sage:#4B6B4F;
    --sage-deep:#2F5A3A;
    --rose:#8C3B2E;
    --hi:#B0362A;
    --line:rgba(59,42,27,0.18);
    --shadow: 4px 4px 0 rgba(59,42,27,0.10);
    --radius: 4px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.55;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(59,42,27,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }

  h1,h2,h3,h4{font-family:var(--font-display); color:var(--wood-deep); margin:0 0 0.4em; font-weight:600;}
  h3{ font-size:1.18rem; margin-top:1.6em; }
  p{margin:0 0 1em;}
  a{color:var(--wood-deep);}

  /* ---------- Layout shell ---------- */
  .shell{ display:grid; grid-template-columns: 250px 1fr; min-height:100vh; }
  @media (max-width:860px){ .shell{ grid-template-columns: 1fr; } }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--wood-deep); color:var(--paper);
    padding:28px 18px 18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  @media (max-width:860px){ .sidebar{ position:static; height:auto; padding:16px; } }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom:22px; padding-bottom:16px;
    border-bottom:1px solid rgba(242,233,211,0.18);
  }
  .brand svg{ width:34px; height:34px; flex-shrink:0; }
  .brand .t{ font-family:var(--font-display); font-size:1.05rem; line-height:1.15; color:var(--paper);}
  .brand .t small{ display:block; font-family:var(--font-body); font-size:0.7rem; color:var(--wood-light); font-weight:500; letter-spacing:0.02em; margin-top:2px;}

  nav.chapters{ margin:0; padding:0; }
  .chap-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left;
    background:none; border:none; cursor:pointer;
    color:var(--wood-light);
    font-family:var(--font-body); font-size:0.88rem; font-weight:500;
    padding:9px 10px; border-radius:3px; margin-bottom:2px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .chap-btn .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%;
    border:1px solid rgba(242,233,211,0.35);
    font-size:0.7rem; flex-shrink:0;
  }
  .chap-btn:hover{ background:rgba(242,233,211,0.08); color:var(--paper); }
  .chap-btn.active{ background:var(--brass); color:var(--wood-deep); font-weight:700;}
  .chap-btn.active .num{ border-color:var(--wood-deep); }
  .chap-btn.seen .num{ border-color:var(--brass); background:rgba(184,134,46,0.32); color:var(--paper); }
  .chap-btn.active.seen .num{ background:rgba(74,50,32,0.20); color:var(--wood-deep); border-color:var(--wood-deep); }
  .chap-group{
    font-size:0.64rem; letter-spacing:0.08em; text-transform:uppercase;
    color:rgba(242,233,211,0.45); margin:14px 10px 4px; font-weight:600;
  }
  @media (max-width:860px){
    nav.chapters{ display:flex; overflow-x:auto; gap:6px; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
    .chap-btn{ white-space:nowrap; width:auto; }
    .chap-group{ display:none; }
  }

  .side-actions{
    margin-top:20px; padding-top:16px;
    border-top:1px solid rgba(242,233,211,0.18);
    display:flex; flex-direction:column; gap:10px;
  }
  .side-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:none; border:1px solid rgba(242,233,211,0.35);
    color:var(--paper);
    font-family:var(--font-body); font-size:0.82rem; font-weight:600;
    padding:9px 12px; border-radius:20px; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .side-btn:hover{ background:var(--brass); color:var(--wood-deep); border-color:var(--brass); }
  .side-hint{ font-size:0.68rem; color:var(--wood-light); text-align:center; line-height:1.6; }
  .side-hint kbd{
    font-family:var(--font-body); font-size:0.7rem;
    border:1px solid rgba(242,233,211,0.30); border-radius:3px; padding:0 4px; margin:0 1px;
  }
  @media (max-width:860px){
    .side-actions{ flex-direction:row; align-items:center; justify-content:flex-start; margin-top:12px; padding-top:12px; }
    .side-hint{ display:none; }
  }

  /* ---------- Main content ---------- */
  main{ padding:0; display:flex; flex-direction:column; min-width:0; }
  .content-scroll{ flex:1; padding:44px 56px 30px; max-width:960px; }
  @media (max-width:860px){ .content-scroll{ padding:28px 16px 20px; } }

  .eyebrow{ font-size:0.78rem; color:var(--rose); font-weight:600; margin-bottom:6px; }
  .chapter{ display:none; animation: fade .3s ease; }
  .chapter.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .lead{ font-size:1.08rem; color:var(--ink-soft); max-width:62ch; }
  .divider{ height:1px; background:var(--line); margin:28px 0; border:none; }

  .card{
    background:var(--paper-deep); border:1px solid var(--line);
    border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow);
  }
  .card h4{ font-size:1rem; margin-bottom:6px; }
  .card p:last-child{ margin-bottom:0; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width:760px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

  .tip{
    border-left:3px solid var(--sage); background:rgba(75,107,79,0.08);
    padding:12px 16px; border-radius:0 4px 4px 0; font-size:0.94rem; margin:18px 0;
  }
  .tip b{ color:var(--sage-deep); }
  .warn{
    border-left:3px solid var(--rose); background:rgba(140,59,46,0.07);
    padding:12px 16px; border-radius:0 4px 4px 0; font-size:0.94rem; margin:18px 0;
  }
  .warn b{ color:var(--rose); }

  /* ideia-chave da aula */
  .key-idea{
    background:var(--wood-deep); color:var(--paper);
    border-radius:var(--radius); padding:18px 22px; margin:22px 0;
    box-shadow:var(--shadow);
  }
  .key-idea .lbl{ font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--string); font-weight:700; margin-bottom:4px; }
  .key-idea p{ margin:0; font-family:var(--font-display); font-size:1.18rem; line-height:1.35; }
  .key-idea b{ color:var(--string); font-weight:600; }

  /* legenda da partitura */
  .key-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px;
    background:var(--paper-deep); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 16px; margin:0 0 18px;
    font-size:0.8rem; color:var(--ink-soft);
  }
  .key-bar b{ color:var(--wood-deep); }
  .key-bar span{ display:inline-flex; align-items:center; gap:6px; }
  .sw{ font-weight:700; font-size:0.86rem; }
  .sw.roman{ color:var(--brass-deep); }
  .sw.cifra{ color:var(--ink); }
  .sw.grau{ color:var(--sage-deep); }
  .sw.hi{ color:var(--hi); }

  /* fórmulas em "fichas" */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
  .chip{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:64px; padding:8px 8px 6px;
    background:var(--sheet); border:1px solid var(--line); border-radius:6px;
    font-family:var(--font-body);
  }
  .chip .r{ font-size:0.72rem; font-weight:700; color:var(--brass-deep); }
  .chip .c{ font-family:var(--font-display); font-weight:600; font-size:1.12rem; color:var(--wood-deep); line-height:1.2; }
  .chip .g{ font-size:0.7rem; color:var(--sage-deep); font-weight:600; }
  .chip.changed{ border-color:var(--hi); box-shadow:inset 0 -3px 0 var(--hi); }
  @media (max-width:520px){ .chip{ min-width:calc(25% - 6px); } }

  /* partituras */
  figure.pauta{
    margin:22px 0; padding:14px 16px 12px;
    background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  figure.pauta figcaption{ margin-bottom:8px; }
  .ex-tag{
    display:inline-block; font-size:0.7rem; font-weight:700; letter-spacing:0.04em;
    color:var(--paper); background:var(--wood); border-radius:12px; padding:2px 9px; margin-right:6px;
    vertical-align:2px;
  }
  .ex-title{ font-family:var(--font-display); font-weight:600; color:var(--wood-deep); font-size:1.04rem; }
  .ex-how{ display:block; font-size:0.86rem; color:var(--ink-soft); margin-top:3px; }
  figure.pauta picture, figure.pauta img{ display:block; max-width:100%; height:auto; }
  figure.pauta img{ margin:4px 0 2px; }
  .play-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; }
  .play-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--sage-deep); color:var(--paper); border:none;
    padding:7px 14px; border-radius:18px; cursor:pointer;
    font-family:var(--font-body); font-weight:600; font-size:0.8rem;
  }
  .play-btn:hover{ background:var(--sage); }
  .play-btn.playing{ background:var(--rose); }
  .play-btn.ghost{ background:none; color:var(--sage-deep); border:1px solid var(--sage); }
  .tempo{ font-size:0.78rem; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px; }
  .tempo select{ font-family:var(--font-body); font-size:0.8rem; background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:3px 8px; color:var(--ink); }

  /* passos de estudo */
  .steps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .steps li{ background:var(--paper-deep); border:1px solid var(--line); border-radius:6px; padding:14px 12px; }
  .steps .n{ font-family:var(--font-display); font-weight:700; font-size:1.5rem; color:var(--brass); line-height:1; }
  .steps h4{ margin:6px 0 4px; font-size:0.98rem; }
  .steps p{ margin:0; font-size:0.84rem; color:var(--ink-soft); }
  @media (max-width:760px){ .steps{ grid-template-columns:1fr 1fr; } }

  /* listas de exercício em texto (igual às outras cartilhas) */
  .ex-list{ list-style:none; margin:0; padding:0; }
  .ex-list li{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
  .ex-list li:last-child{ border-bottom:none; }
  .ex-list .n{
    flex-shrink:0; width:30px; height:30px; border-radius:50%;
    background:var(--wood-deep); color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:0.95rem;
  }
  .ex-list h4{ margin:0 0 3px; font-size:1rem; }
  .ex-list p{ margin:0; font-size:0.92rem; color:var(--ink-soft); }

  /* tabelas */
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0 22px; border:1px solid var(--line); border-radius:var(--radius); background:var(--sheet); }
  table.campo{ border-collapse:collapse; width:100%; font-size:0.86rem; min-width:620px; }
  table.campo th, table.campo td{ padding:7px 8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  table.campo thead th{ background:var(--paper-deep); color:var(--brass-deep); font-size:0.76rem; font-weight:700; }
  table.campo tbody th{ text-align:left; font-family:var(--font-display); color:var(--wood-deep); font-weight:600; }
  table.campo tbody tr:last-child td, table.campo tbody tr:last-child th{ border-bottom:none; }
  table.campo tr.easy th::after{ content:"●"; color:var(--sage); font-size:0.6rem; margin-left:5px; vertical-align:2px; }
  table.campo td.hl{ color:var(--hi); font-weight:600; }
  table.simple{ border-collapse:collapse; width:100%; font-size:0.9rem; }
  table.simple th, table.simple td{ padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  table.simple thead th{ background:var(--paper-deep); color:var(--wood-deep); font-size:0.8rem; }

  /* teste rápido */
  .quiz{ list-style:none; margin:0; padding:0; counter-reset:q; }
  .quiz li{ counter-increment:q; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.94rem; }
  .quiz li:last-child{ border-bottom:none; }
  .quiz li::before{ content:counter(q) ". "; font-weight:700; color:var(--brass-deep); }
  .quiz details{ display:inline; }
  .quiz summary{
    display:inline-block; cursor:pointer; list-style:none; margin-left:6px;
    font-size:0.74rem; font-weight:600; color:var(--sage-deep);
    border:1px solid var(--sage); border-radius:12px; padding:1px 9px;
  }
  .quiz summary::-webkit-details-marker{ display:none; }
  .quiz details[open] summary{ background:var(--sage-deep); color:var(--paper); border-color:var(--sage-deep); }
  .quiz .ans{ display:block; margin-top:6px; color:var(--sage-deep); font-weight:600; }

  /* checklist da aula */
  .checklist{ list-style:none; margin:0; padding:0; }
  .checklist li{ padding:6px 0; }
  .checklist label{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:0.94rem; }
  .checklist input{ width:18px; height:18px; margin-top:2px; accent-color:var(--sage-deep); flex-shrink:0; }
  .check-progress{ font-size:0.78rem; color:var(--ink-soft); margin-top:8px; }

  /* jogos */
  .game{ background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin:18px 0; box-shadow:var(--shadow); }
  .game h4{ margin:0 0 4px; font-size:1.05rem; }
  .game p.how{ font-size:0.9rem; color:var(--ink-soft); margin:0 0 12px; }
  .game .controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .game select{ font-family:var(--font-body); font-size:0.85rem; background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 10px; color:var(--ink); }
  .game .out{
    margin-top:14px; min-height:64px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    font-family:var(--font-display); font-size:1.7rem; color:var(--wood-deep); font-weight:600;
  }
  .game .out .small{ font-family:var(--font-body); font-size:0.9rem; color:var(--ink-soft); font-weight:500; }
  .game .reveal{ font-family:var(--font-body); font-size:1rem; color:var(--sage-deep); font-weight:600; }
  .game .score-line{ font-size:0.8rem; color:var(--ink-soft); margin-top:6px; }
  .answer-btns{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .answer-btns button{ font-family:var(--font-body); font-size:0.85rem; font-weight:600; background:#fff; border:1px solid var(--line); border-radius:16px; padding:6px 12px; cursor:pointer; color:var(--wood-deep); }
  .answer-btns button.ok{ background:var(--sage-deep); color:#fff; border-color:var(--sage-deep); }
  .answer-btns button.no{ background:var(--rose); color:#fff; border-color:var(--rose); }

  /* FAQ */
  details.faq{ border-bottom:1px solid var(--line); padding:14px 0; }
  details.faq summary{
    cursor:pointer; font-family:var(--font-display); font-weight:600;
    font-size:1.02rem; color:var(--wood-deep); list-style:none;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  details.faq summary::-webkit-details-marker{ display:none; }
  details.faq summary::after{ content:"+"; font-size:1.3rem; color:var(--brass); font-family:var(--font-body); font-weight:400; }
  details.faq[open] summary::after{ content:"–"; }
  details.faq p{ margin-top:10px; font-size:0.94rem; color:var(--ink-soft); max-width:65ch; }

  /* footer nav */
  .page-footer{
    border-top:1px solid var(--line); padding:18px 56px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:var(--paper-deep);
  }
  @media (max-width:860px){ .page-footer{ padding:14px 16px; } }
  .page-footer .prog{ font-size:0.8rem; color:var(--ink-soft); font-family:var(--font-body); text-align:center; }
  .nav-btn{
    background:var(--wood-deep); color:var(--paper);
    border:none; padding:10px 18px; border-radius:20px;
    font-family:var(--font-body); font-weight:600; font-size:0.85rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .nav-btn:hover:not(:disabled){ background:var(--brass); color:var(--wood-deep); }

  .cover{ display:flex; flex-direction:column; align-items:flex-start; justify-content:center; min-height:50vh; }
  .cover .big{ font-size:clamp(2.1rem, 5vw, 3.2rem); line-height:1.05; max-width:14ch; }
  .cover > svg{ margin:0 0 22px; max-width:100%; height:auto; }
  .credit{ font-size:0.8rem; color:var(--ink-soft); margin-top:18px; }

  .nowrap{ white-space:nowrap; }
  .mono{ font-variant-numeric:tabular-nums; }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  /* ---------- Impressao / PDF ---------- */
  @media print{
    @page{ margin:13mm 12mm; }
    html,body{ background:#fff !important; background-image:none !important; color:#000; font-size:10.5pt; }
    .shell{ display:block; min-height:0; }
    .sidebar, .page-footer, .side-actions, .no-print, .play-row, .game .controls, .answer-btns{ display:none !important; }
    main{ display:block; }
    .content-scroll{ max-width:none; padding:0; }

    /* a cartilha inteira sai numa tirada so, uma aula por pagina */
    .chapter{ display:block !important; animation:none !important; }
    .chapter + .chapter{ break-before:page; page-break-before:always; }
    .cover{ min-height:0; }

    figure.pauta, .card, .tip, .warn, .key-idea, .key-bar, .ex-list li, details.faq, .game, .quiz li, .steps li, .chips, .table-scroll{
      break-inside:avoid; page-break-inside:avoid;
    }
    h1,h2,h3,h4{ break-after:avoid; page-break-after:avoid; }

    /* economia de tinta: fundos chapados viram branco com borda */
    .card, .key-bar, figure.pauta, .game, .steps li, .chip, .table-scroll{ background:#fff; box-shadow:none; border:1px solid #b9ab92; }
    .key-idea{ background:#fff; color:#000; border:2px solid var(--wood-deep); box-shadow:none; }
    .key-idea .lbl, .key-idea b{ color:var(--brass-deep); }
    .tip, .warn{ background:#fff; }
    figure.pauta{ padding:8px 10px; margin:12px 0; }
    .table-scroll{ overflow:visible; }
    table.campo{ min-width:0; font-size:8.5pt; }
    table.campo th, table.campo td{ padding:4px 5px; }
    .game .out{ display:none; }
    .quiz summary{ display:none; }
    details.faq summary::after{ content:"" !important; }
    a{ color:#000; text-decoration:none; }
    .checklist input{ appearance:none; -webkit-appearance:none; border:1.5px solid #555; border-radius:3px; }
  }
</style>
</head>
