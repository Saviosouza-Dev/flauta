<!DOCTYPE html>
<html lang="pt-BR" data-instrumento="flauta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Harmonização aplicada para Flauta — Cartilha do Aluno</title>
<meta name="description" content="Cartilha do aluno de flauta transversal: nome das notas e cifras, escala maior e graus, formação de acordes, campo harmônico maior e campos menores (natural, harmônico e melódico), com exercícios em partitura, áudio e jogos.">
<meta name="theme-color" content="#ECE3D2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0C09" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Desenho da pauta quando o aluno muda de tom (vendorizado: nada de CDN, funciona offline).
     TRANSPOSE_DATA vem de partituras/transpose_data.js, gerado por ferramentas/montar.py
     a partir da teoria em ferramentas/transpose.py — sem depender do LilyPond. -->
<script src="vexflow.min.js"></script>
<script src="partituras/transpose_data.js"></script>
{{TEMA}}
<script>
  /* paleta escolhida pelo aluno (vale para todas as cartilhas do site) —
     aplicada antes de desenhar a página, para não piscar a cor padrão */
  try { var p = localStorage.getItem('gc-paleta'); if (p) document.documentElement.dataset.paleta = p; } catch (e) {}
</script>
</head>
